# Configuration pour les tests d'intégration
spring.application.name=SmartSupply-Test

# Base de données H2 en mémoire
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# JWT Configuration (clé de test)
jwt.secret=testSecretKeyForIntegrationTestsOnlyDoNotUseInProductionMustBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Désactiver Logstash pour les tests
logging.config=classpath:logback-test.xml

# Logs
logging.level.root=WARN
logging.level.com.example.StockFlow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=false

